name: Python Client Tests

on:
  pull_request:
    branches:
      - master
      - 'release-*'
    paths:
      - 'clients/python-client/**'
      - '.github/workflows/python-client-tests.yaml'
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - 'clients/python-client/**'
      - '.github/workflows/python-client-tests.yaml'

concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  python-client-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up gotestfmt
        uses: gotesttools/gotestfmt-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup and start KinD cluster
        uses: ./.github/workflows/actions/kind

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Add KubeRay Helm repo
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update

      - name: Install KubeRay operator
        run: |
          helm install kuberay-operator kuberay/kuberay-operator --version 1.1.0
          kubectl wait --for=condition=Available deployment/kuberay-operator --timeout=300s
          # Wait for CRDs to be ready
          kubectl wait --for=condition=established --timeout=300s crd/rayclusters.ray.io
          kubectl wait --for=condition=established --timeout=300s crd/rayjobs.ray.io
          # Wait for operator to be ready to handle resources
          kubectl rollout status deployment/kuberay-operator --timeout=300s

      - name: Install dependencies
        run: |
          cd clients/python-client
          pip install -e .
          pip install pytest

      - name: Run Python client integration tests with pytest
        run: |
          pytest -s clients/python-client/python_client_test/

      - name: Print KubeRay operator logs
        run: |
          echo "Printing KubeRay operator logs"
          kubectl logs -n default --tail -1 -l app.kubernetes.io/name=kuberay-operator | tee ./kuberay-operator.log

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          retention-days: 10
          path: |
            **/*.log 